name: CI & PR Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  quality-gate:
    name: Quality Gate (Lint, Typecheck, Test, Build, Link Check)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (Pinned via .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: 1. ESLint Check
        run: npm run lint

      - name: 2. TypeScript & Astro Typecheck
        run: npm run typecheck

      - name: 3. Unit Test Suite (Vitest)
        run: npm test

      - name: 4. Static Production Build
        run: npm run build:prod

      - name: 5. Link & Asset Integrity Check
        run: npm run check:links

      - name: 6. Fee Freshness Verification (Current)
        run: npx tsx scripts/check-fee-freshness.ts || true

  preview-deploy:
    name: Cloudflare Pages Preview Deployment
    needs: quality-gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Production Build
        run: npm run build:prod

      - name: Deploy PR Preview to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        id: pages_preview
        continue-on-error: true
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: 'sellercalchub'
          directory: 'dist'
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.head_ref }}

      - name: Add PR Preview Comment
        if: steps.pages_preview.outputs.url != ''
        uses: actions/github-script@v7
        with:
          script: |
            const previewUrl = '${{ steps.pages_preview.outputs.url }}';
            const body = `### 🚀 Cloudflare Pages Preview Ready!\n\n- **Preview URL:** [${previewUrl}](${previewUrl})\n- **Commit:** \`${{ github.sha }}\`\n- **Branch:** \`${{ github.head_ref }}\`\n\nAll automated checks passed (lint, type-check, tests, link check).`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body,
            });
